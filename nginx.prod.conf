# ============================================================
# AULIA CARE - PRODUCTION REVERSE PROXY
# ============================================================
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    
    # --------------------------------------------------------
    # BASIC HTTP SETTINGS
    # --------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 65;

    server_tokens off;

    # --------------------------------------------------------
    # LOGGING
    # --------------------------------------------------------
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


    # ========================================================
    # UPSTREAMS
    # ========================================================

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 16;
    }

    upstream backend_upstream {
        server backend:3000;
        keepalive 16;
    }


    # ========================================================
    # HTTP SERVER
    #
    # IMPORTANT:
    # HTTP reste actif pour le moment.
    #
    # Lorsque HTTPS réel sera installé, ce serveur pourra être
    # transformé en redirection permanente vers HTTPS.
    # ========================================================

    server {
        listen 8080;
        server_name _;

        client_max_body_size 25M;


        # ----------------------------------------------------
        # SECURITY HEADERS COMPATIBLES HTTP / HTTPS
        # ----------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # ----------------------------------------------------
        # BACKEND API
        # ----------------------------------------------------

        location /api/ {
            proxy_pass http://backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # ----------------------------------------------------
        # SOCKET.IO / WEBSOCKET
        # ----------------------------------------------------

        location /socket.io/ {
            proxy_pass http://backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # ----------------------------------------------------
        # FRONTEND
        # ----------------------------------------------------

        location / {
            proxy_pass http://frontend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }


    # ========================================================
    # HTTPS SERVER - PREPARED BUT NOT ACTIVATED
    # ========================================================
    #
    # NE PAS DÉCOMMENTER tant que les certificats n'existent pas.
    #
    # Lorsque nous aurons le domaine + certificat réel,
    # nous activerons ce bloc.
