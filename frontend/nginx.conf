server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets générés par Vite.
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit pas rester figé dans le cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}