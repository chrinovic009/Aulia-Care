services:
  postgres:
    image: postgres:16-alpine
    container_name: aulia-care-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aulia_care
      POSTGRES_USER: aulia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - aulia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulia -d aulia_care"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aulia-network

  redis:
    image: redis:7-alpine
    container_name: aulia-care-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    ports:
      - "6379:6379"

    volumes:
      - aulia_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aulia-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev

    container_name: aulia-care-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://aulia:${POSTGRES_PASSWORD}@postgres:5432/aulia_care?schema=public

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173

      # Docker DNS, never localhost: each service is an independent process.
      AULIA_CLINICAL_AI_URL: http://clinical-ai:3100

    volumes:
      - ./backend:/app/backend
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      clinical-ai:
        condition: service_started

    networks:
      - aulia-network

  # Independently deployable clinical intelligence process. It exposes no host
  # port: only Core can invoke its versioned, secret-protected contract.
  clinical-ai:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev

    container_name: aulia-care-ai-service
    restart: unless-stopped
    command: npm run dev:clinical-ai

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      CLINICAL_AI_PORT: 3100

    volumes:
      - ./backend:/app/backend
      - /app/node_modules

    expose:
      - "3100"

    networks:
      - aulia-network

  # Connected Care remains a separate gateway. It communicates with Core only
  # through the versioned ingestion contract and an integration secret.
  connected-care:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev

    container_name: aulia-care-connected-service
    restart: unless-stopped
    command: npm run dev:connected-care

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      CONNECTED_CARE_PORT: 3200
      AULIA_CORE_CONNECTED_CARE_URL: http://backend:3000/api

    volumes:
      - ./backend:/app/backend
      - /app/node_modules

    depends_on:
      backend:
        condition: service_started

    expose:
      - "3200"

    networks:
      - aulia-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev

    container_name: aulia-care-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      NODE_ENV: development
      AULIA_BACKEND_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules

    depends_on:
      backend:
        condition: service_started

    networks:
      - aulia-network

volumes:
  aulia_postgres_data:
  aulia_redis_data:

networks:
  aulia-network:
    driver: bridge
