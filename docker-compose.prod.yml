name: aulia-care-prod

services:

  # ============================================================
  # POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 200

    env_file:
      - .env.prod

    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - aulia-prod-network


  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 100

    env_file:
      - .env.prod

    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
      ]

    volumes:
      - redis-prod-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - aulia-prod-network


  # ============================================================
  # DATABASE MIGRATIONS
  # ============================================================
  migration:
    image: aulia-care-migration:prod
    restart: "no"

    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 100

    env_file:
      - .env.prod

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - aulia-prod-network


  # ============================================================
  # BACKEND PRINCIPAL
  # ============================================================
  backend:
    image: aulia-care-backend:prod
    restart: unless-stopped

    cpus: "1.50"
    mem_limit: 1g
    pids_limit: 300

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      PORT: 3000

    depends_on:
      migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - aulia-prod-network


  # ============================================================
  # CLINICAL AI
  # ============================================================
  clinical-ai:
    image: aulia-care-backend:prod
    restart: unless-stopped

    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 250

    command:
      [
        "node",
        "dist/main-clinical-ai.js"
      ]

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      CLINICAL_AI_PORT: 3100

    depends_on:
      migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    expose:
      - "3100"

    networks:
      - aulia-prod-network


  # ============================================================
  # CONNECTED CARE
  # ============================================================
  connected-care:
    image: aulia-care-backend:prod
    restart: unless-stopped

    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 250

    command:
      [
        "node",
        "dist/main-connected-care.js"
      ]

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      CONNECTED_CARE_PORT: 3200

    depends_on:
      migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    expose:
      - "3200"

    networks:
      - aulia-prod-network


  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    image: aulia-care-frontend:prod
    restart: unless-stopped

    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 100

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "8080"

    networks:
      - aulia-prod-network


  # ============================================================
  # REVERSE PROXY
  # ============================================================
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped

    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 100

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "127.0.0.1:8081:8080"

    networks:
      - aulia-prod-network


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  postgres-prod-data:
    name: aulia-care-prod-postgres-data

  redis-prod-data:
    name: aulia-care-prod-redis-data


# ==============================================================
# NETWORK
# ==============================================================
networks:
  aulia-prod-network:
    name: aulia-care-prod-network
    driver: bridge